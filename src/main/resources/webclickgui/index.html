<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oxevy ClickGui</title>
  <link rel="stylesheet" href="/style.css" />
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script crossorigin src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
const { useState, useEffect, useCallback } = React;

const API = {
  async getState() {
    const r = await fetch("/api/state");
    if (!r.ok) throw new Error(await r.text());
    return r.json();
  },
  async toggle(mod) {
    const r = await fetch("/api/module/toggle", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({module:mod}) });
    return r.json();
  },
  async setSetting(mod, setting, value) {
    const r = await fetch("/api/setting", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({module:mod, setting, value}) });
    return r.json();
  },
  async getCapeState() {
    const r = await fetch("/api/capes/state");
    return r.json();
  },
  async getRepoCapes() {
    const r = await fetch("/api/capes/repo");
    return r.json();
  },
  async selectCape(opts) {
    const r = await fetch("/api/cape/select", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(opts) });
    return r.json();
  }
};

function Sidebar({ categories, activeKey, onSelect, onCapeClick, showCape }) {
  return (
    <aside className="sidebar">
      <div className="brand">
        <div className="brand-mark">OX</div>
      </div>
      <div className="sidebar-list">
        {categories.map(cat => (
          <button key={cat.key} className={"sidebar-item"+(cat.key===activeKey?" active":"")} onClick={()=>onSelect(cat.key)} title={cat.name}>
            <span style={{fontFamily:"Wexside",fontSize:20}}>{cat.icon||cat.name.slice(0,2).toUpperCase()}</span>
            <span className="icon-label">{cat.shortName||cat.name.slice(0,2).toUpperCase()}</span>
            {cat.enabledCount>0&&<span className="sidebar-count">{cat.enabledCount>9?"9+":cat.enabledCount}</span>}
          </button>
        ))}
        <button className={"sidebar-item cape-btn"+(showCape?" active":"")} onClick={onCapeClick} title="Capes">
          <span style={{fontSize:18}}>C</span>
          <span className="icon-label">CP</span>
        </button>
      </div>
    </aside>
  );
}

function Toggle({ enabled, onClick }) {
  return <button className={"toggle"+(enabled?" on":"")} onClick={onClick}><span className="toggle-thumb" /></button>;
}

function KeybindBadge({ label }) {
  if (!label||label==="None") return null;
  return <span className="badge">{label}</span>;
}

function ModuleCard({ mod, selected, onToggle, onSelect }) {
  return (
    <div className={"card"+(mod.enabled?" on":"")+(selected?" selected":"")}>
      <div className="card-main">
        <Toggle enabled={mod.enabled} onClick={onToggle} />
        <div className="card-body" onClick={onSelect}>
          <strong>{mod.name}</strong>
          {mod.description&&<span>{mod.description}</span>}
        </div>
      </div>
      <div className="card-extra">
        <KeybindBadge label={mod.bind.label} />
        <button className="btn-icon" onClick={onSelect} title="Settings">{">"}</button>
      </div>
    </div>
  );
}

function BoolSetting({ setting, onChange }) {
  return (
    <div className="setting">
      <span>{setting.name}</span>
      <Toggle enabled={setting.value} onClick={()=>onChange(!setting.value)} />
    </div>
  );
}

function NumSetting({ setting, onChange }) {
  const [v,setV]=useState(setting.value);
  useEffect(()=>setV(setting.value),[setting.value]);
  const commit=()=>onChange(Number(v));
  return (
    <div className="setting">
      <span>{setting.name} <em>{Number(v).toFixed(setting.step===1?0:1)}</em></span>
      <input type="range" min={setting.min} max={setting.max} step={setting.step} value={v} onChange={e=>setV(e.target.value)} onMouseUp={commit} onTouchEnd={commit} />
    </div>
  );
}

function StrSetting({ setting, onChange }) {
  const [v,setV]=useState(setting.value);
  useEffect(()=>setV(setting.value),[setting.value]);
  const commit=()=>onChange(v);
  return <div className="setting"><span>{setting.name}</span><input type="text" value={v} onChange={e=>setV(e.target.value)} onBlur={commit} onKeyDown={e=>e.key==="Enter"&&commit()} /></div>;
}

function EnumSetting({ setting, onChange }) {
  return <div className="setting"><span>{setting.name}</span><select value={setting.value} onChange={e=>onChange(e.target.value)}>{setting.options.map(o=><option key={o} value={o}>{o}</option>)}</select></div>;
}

function ColorSetting({ setting, onChange }) {
  const rows=[["r","#ff5a5a"],["g","#5aff96"],["b","#5aaaff"],["a","#dcdcdc"]];
  return (
    <div className="setting">
      <span>{setting.name}</span>
      {rows.map(([c,cl])=>(
        <div key={c} className="color-row">
          <span className="swatch" style={{background:cl}}></span>
          <input type="range" min={0} max={255} step={1} value={setting.value[c]} onChange={e=>{const n={...setting.value,[c]:Number(e.target.value)};onChange(n)}} />
          <span>{setting.value[c]}</span>
        </div>
      ))}
    </div>
  );
}

function BindSetting({ setting, onChange }) {
  const [capture,setCapture]=useState(false);
  useEffect(()=>{
    if(!capture)return;
    const h=e=>{
      e.preventDefault();
      const map={Space:32,Escape:256,Enter:257,NumpadEnter:257,Tab:258,Backspace:259,Insert:260,Delete:261,ArrowRight:262,ArrowLeft:263,ArrowDown:264,ArrowUp:265,ShiftLeft:340,ShiftRight:344,ControlLeft:341,ControlRight:345,AltLeft:342,AltRight:346};
      const k=map[e.code]??(e.code.startsWith("Key")?e.code.charCodeAt(3):e.code.startsWith("Digit")?e.code.charCodeAt(5):null);
      if(k!=null){setCapture(false);onChange({key:k})}
    };
    window.addEventListener("keydown",h);
    return ()=>window.removeEventListener("keydown",h);
  },[capture]);
  return (
    <div className="setting">
      <span>{setting.name} <em>{setting.value.label}</em></span>
      <div className="setting-actions">
        <button className="btn" onClick={()=>setCapture(true)}>{capture?"Press key...":"Set"}</button>
        <button className="btn" onClick={()=>onChange({key:-1})}>Clear</button>
      </div>
    </div>
  );
}

function SettingsDrawer({ mod, onToggle, onSettingChange, onClose }) {
  useEffect(()=>{
    if(!mod)return;
    const h=e=>{if(e.key==="Escape")onClose()};
    window.addEventListener("keydown",h);
    return ()=>window.removeEventListener("keydown",h);
  },[mod,onClose]);
  if(!mod)return<aside className="drawer"><div className="drawer-empty">Select a module</div></aside>;
  return (
    <aside className="drawer">
      <div className="drawer-head"><h2>{mod.name}</h2><button className="btn-icon" onClick={onClose}>X</button></div>
      <div className="drawer-body">
        <div className="setting"><span>Status</span><Toggle enabled={mod.enabled} onClick={()=>onToggle(mod.id)} /></div>
        {mod.settings.map(s=>{
          const onC=(v)=>onSettingChange(mod.id,s.id,v);
          switch(s.type){
            case"boolean":return<BoolSetting key={s.id} setting={s} onChange={onC}/>;
            case"number":return<NumSetting key={s.id} setting={s} onChange={onC}/>;
            case"string":return<StrSetting key={s.id} setting={s} onChange={onC}/>;
            case"enum":return<EnumSetting key={s.id} setting={s} onChange={onC}/>;
            case"color":return<ColorSetting key={s.id} setting={s} onChange={onC}/>;
            case"bind":return<BindSetting key={s.id} setting={s} onChange={onC}/>;
            default:return null;
          }
        })}
      </div>
    </aside>
  );
}

function Cape3DPreview({ url }) {
  const containerRef = useRef(null);
  const sceneRef = useRef(null);
  const capeMeshRef = useRef(null);
  const animRef = useRef(null);

  useEffect(() => {
    if (!containerRef.current) return;
    const w = containerRef.current.clientWidth;
    const h = 240;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0d1016);

    const camera = new THREE.PerspectiveCamera(40, w / h, 0.1, 10);
    camera.position.set(0, 0.6, 2.5);
    camera.lookAt(0, 0.5, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(w, h);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    containerRef.current.appendChild(renderer.domElement);

    // Lights
    const ambient = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambient);
    const dir = new THREE.DirectionalLight(0xffffff, 0.8);
    dir.position.set(1, 2, 1);
    scene.add(dir);
    const back = new THREE.DirectionalLight(0x88aaff, 0.4);
    back.position.set(-1, 0, -1);
    scene.add(back);

    // Player body
    const bodyMat = new THREE.MeshPhongMaterial({ color: 0x3b82f6 });
    const headMat = new THREE.MeshPhongMaterial({ color: 0xfbbf24 });
    const armMat = new THREE.MeshPhongMaterial({ color: 0x3b82f6 });
    const legMat = new THREE.MeshPhongMaterial({ color: 0x1e40af });
    const skinMat = new THREE.MeshPhongMaterial({ color: 0xf5d6b8 });

    const group = new THREE.Group();

    // Head
    const head = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 0.4), headMat);
    head.position.set(0, 1.15, 0);
    group.add(head);

    // Helmet layer (slightly larger)
    const helmet = new THREE.Mesh(new THREE.BoxGeometry(0.44, 0.44, 0.44), new THREE.MeshPhongMaterial({ color: 0xfbbf24, transparent: true, opacity: 0.15 }));
    helmet.position.copy(head.position);
    group.add(helmet);

    // Body (torso)
    const body = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.5, 0.2), bodyMat);
    body.position.set(0, 0.7, 0);
    group.add(body);

    // Left arm
    const lArm = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.45, 0.12), armMat);
    lArm.position.set(-0.28, 0.75, 0);
    group.add(lArm);

    // Right arm
    const rArm = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.45, 0.12), armMat);
    rArm.position.set(0.28, 0.75, 0);
    group.add(rArm);

    // Legs
    const lLeg = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.45, 0.12), legMat);
    lLeg.position.set(-0.1, 0.23, 0);
    group.add(lLeg);

    const rLeg = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.45, 0.12), legMat);
    rLeg.position.set(0.1, 0.23, 0);
    group.add(rLeg);

    scene.add(group);

    // Cape
    const capeGeo = new THREE.PlaneGeometry(0.5, 0.65);
    const capeMat = new THREE.MeshPhongMaterial({
      color: 0x888888,
      side: THREE.DoubleSide,
      transparent: true,
    });
    const cape = new THREE.Mesh(capeGeo, capeMat);
    cape.position.set(0, 0.65, -0.12);
    scene.add(cape);
    capeMeshRef.current = cape;

    // Floor shadow
    const shadowMat = new THREE.MeshPhongMaterial({ color: 0x000000, transparent: true, opacity: 0.2 });
    const shadow = new THREE.Mesh(new THREE.CircleGeometry(0.5, 16), shadowMat);
    shadow.rotation.x = -Math.PI / 2;
    shadow.position.set(0, -0.02, 0);
    scene.add(shadow);

    // Orbit controls for interaction
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableZoom = false;
    controls.enablePan = false;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 2;
    controls.target.set(0, 0.5, 0);
    controls.update();

    const animate = () => {
      animRef.current = requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    };
    animate();

    sceneRef.current = { scene, camera, renderer, controls };

    return () => {
      if (animRef.current) cancelAnimationFrame(animRef.current);
      controls.dispose();
      renderer.dispose();
      if (containerRef.current && renderer.domElement.parentElement === containerRef.current) {
        containerRef.current.removeChild(renderer.domElement);
      }
    };
  }, []);

  // Update cape texture when URL changes
  useEffect(() => {
    if (!capeMeshRef.current || !url) return;
    const loader = new THREE.TextureLoader();
    loader.load(url, tex => {
      tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
      capeMeshRef.current.material.map = tex;
      capeMeshRef.current.material.color.set(0xffffff);
      capeMeshRef.current.material.needsUpdate = true;
    }, undefined, () => {
      // on error - keep the gray color
    });
  }, [url]);

  return <div ref={containerRef} className="cape-3d-preview" />;
}

function CapePanel({ capeData, repoData, onSelectCape }) {
  const [viewCapeUrl, setViewCapeUrl] = useState(null);
  const textStyle = { color: "var(--muted)", textAlign: "center", padding: "24px", fontSize: "13px" };
  return (
    <section className="main-panel">
      <div className="panel-head">
        <div><h1>Cape Selection</h1><p>Choose your cape</p></div>
      </div>
      <div className="cape-layout">
        <div className="cape-list-col">
          {(!repoData || !repoData.capes || repoData.capes.length === 0) ? (
            <div style={textStyle}>Loading capes from repository...</div>
          ) : (
            <div className="cape-grid">
              {repoData.capes.map(c => {
                const activeUrl = capeData ? (capeData.customUrl || (capeData.capes && capeData.capes[capeData.activeIndex] && capeData.capes[capeData.activeIndex].url) || "") : "";
                const isActive = c.url === activeUrl;
                return (
                  <div key={c.index} className={"cape-card"+(isActive?" active":"")} onClick={() => { onSelectCape(c.index); setViewCapeUrl(c.url); }}>
                    <div className="cape-thumb-wrap">
                      <img src={c.url} alt={c.name} className="cape-thumb" crossOrigin="anonymous" onError={e=>{e.target.style.display="none"}} />
                    </div>
                    <span className="cape-name">{c.name}</span>
                    {isActive && <span className="cape-badge">Active</span>}
                  </div>
                );
              })}
            </div>
          )}
          {capeData && capeData.mode === "NONE" && !repoData?.capes?.length && (
            <div style={textStyle}>No capes available. Add capes to the oxevy-assets repo.</div>
          )}
        </div>
        <div className="cape-preview-col">
          <Cape3DPreview url={viewCapeUrl} />
        </div>
      </div>
    </section>
  );
}

function MainPanel({ categories, activeKey, selectedId, onToggle, onSelectModule, search, onSearch }) {
  const cat=categories.find(c=>c.key===activeKey);
  const raw=cat?cat.modules:[];
  const q=search.trim().toLowerCase();
  const mods=q?raw.filter(m=>m.name.toLowerCase().includes(q)||(m.description&&m.description.toLowerCase().includes(q))):raw;
  const enabledCount=raw.filter(m=>m.enabled).length;
  return (
    <section className="main-panel">
      <div className="panel-head">
        <div><h1>{cat?cat.name:"Modules"}</h1><p>{enabledCount}/{raw.length} enabled</p></div>
      </div>
      <div className="search-wrap"><input className="search" type="text" placeholder="Search modules" value={search} onChange={e=>onSearch(e.target.value)} />{search&&<button className="search-clear" onClick={()=>onSearch("")}>✕</button>}</div>
      <div className="module-list">
        {mods.length===0?<div className="empty">No modules match</div>:mods.map(m=><ModuleCard key={m.id} mod={m} selected={m.id===selectedId} onToggle={()=>onToggle(m.id)} onSelect={()=>onSelectModule(m.id)} />)}
      </div>
    </section>
  );
}

function App() {
  const [data,setData]=useState(null);
  const [capeData,setCapeData]=useState(null);
  const [repoData,setRepoData]=useState(null);
  const [activeKey,setActiveKey]=useState(null);
  const [selectedId,setSelectedId]=useState(null);
  const [search,setSearch]=useState("");
  const [showCape,setShowCape]=useState(false);

  const load=useCallback(async()=>{
    try{const d=await API.getState();setData(d);if(!activeKey&&d.categories.length)setActiveKey(d.categories[0].key);}catch(e){console.error(e)}
  },[activeKey]);

  const loadCape=useCallback(async()=>{
    try{const d=await API.getCapeState();setCapeData(d);}catch(e){console.error(e)}
  },[]);

  const loadRepo=useCallback(async()=>{
    try{const d=await API.getRepoCapes();setRepoData(d);}catch(e){console.error(e)}
  },[]);

  useEffect(()=>{load()},[load]);
  useEffect(()=>{loadCape()},[loadCape]);
  useEffect(()=>{loadRepo()},[loadRepo]);

  useEffect(()=>{const i=setInterval(load,2000);return ()=>clearInterval(i)},[load]);
  useEffect(()=>{const i=setInterval(loadCape,2000);return ()=>clearInterval(i)},[loadCape]);
  useEffect(()=>{const i=setInterval(loadRepo,5000);return ()=>clearInterval(i)},[loadRepo]);

  const hToggle=useCallback(async(id)=>{setData(await API.toggle(id));},[]);
  const hSetting=useCallback(async(modId,setId,val)=>{setData(await API.setSetting(modId,setId,val));},[]);
  const hSelect=useCallback((id)=>{setSelectedId(p=>p===id?null:id);},[]);
  const hCategory=useCallback((k)=>{setActiveKey(k);setSelectedId(null);setShowCape(false);},[]);
  const hCapeClick=useCallback(()=>{setShowCape(p=>!p);setSelectedId(null);},[]);

  const hCapeSelect=useCallback(async(repoIndex)=>{
    await API.selectCape({repoIndex});
    loadCape();
  },[]);

  if(!data)return <div className="loading">Connecting to Oxevy...</div>;

  const findMod=(id)=>{for(const c of data.categories){const m=c.modules.find(x=>x.id===id);if(m)return m;}return null;};

  return (
    <div className="shell">
      <Sidebar categories={data.categories} activeKey={showCape?"_cape":activeKey} onSelect={hCategory} onCapeClick={hCapeClick} showCape={showCape} />
      {showCape ? (
        <CapePanel capeData={capeData} repoData={repoData} onSelectCape={hCapeSelect} />
      ) : (
        <MainPanel categories={data.categories} activeKey={activeKey} selectedId={selectedId} onToggle={hToggle} onSelectModule={hSelect} search={search} onSearch={setSearch} />
      )}
      <SettingsDrawer mod={findMod(selectedId)} onToggle={hToggle} onSettingChange={hSetting} onClose={()=>setSelectedId(null)} />
    </div>
  );
}

const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(App));
  </script>
</body>
</html>
