<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Oxevy Config Manager</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{margin:0;padding:0;background:transparent;height:100%}
    body{font-family:system-ui,sans-serif;color:#e8eaff}
    .ac-root{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
    .ac-stage{position:absolute;inset:0;background:transparent}
    .ac-window{position:relative;background:#1a1f3a;border:2px solid #4f8cff;border-radius:16px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.8);width:420px;max-width:90vw;max-height:80vh;overflow-y:auto;color:#e8eaff}
    .ac-window *{color:#000000}
    .ac-window h1{font-size:20px;margin-bottom:8px}
    .ac-current{font-size:13px;color:#9aa3c7;margin-bottom:16px}
    .ac-row{display:flex;gap:8px;margin-bottom:12px}
    .ac-input{flex:1;padding:8px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.3);color:#fff;font-size:13px}
    .ac-btn{padding:8px 16px;border-radius:8px;border:none;background:#4f8cff;color:#fff;font-size:13px;cursor:pointer}
    .ac-btn:disabled{opacity:.4;cursor:not-allowed}
    .ac-btn.small{padding:4px 10px;font-size:12px}
    .ac-btn.danger{background:#ff4d6d}
    .ac-msg{font-size:12px;color:#9aa3c7;margin-bottom:12px}
    .ac-list{display:flex;flex-direction:column;gap:6px;max-height:280px;overflow-y:auto}
    .ac-item{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:8px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08)}
    .ac-item.active{border-color:#4f8cff;background:rgba(79,140,255,.12)}
    .ac-name{font-size:13px;font-weight:600}
    .ac-actions{display:flex;gap:6px}
    .ac-back{background:none;border:none;color:#4f8cff;font-size:13px;cursor:pointer;margin-bottom:12px;padding:0}
  </style>
</head>
<body>
  <div style="position:fixed;top:10px;left:10px;background:red;color:white;padding:10px;z-index:9999;font-size:20px">CONFIG PAGE LOADED</div>
  <div class="ac-root">
    <div class="ac-window" style="background:#ffffff;color:#000000;min-height:200px">
      <button class="ac-back" onclick="window.parent.closeOverlay?window.parent.closeOverlay():window.close()">← Back to Menu</button>
      <h1>Config Manager</h1>
      <div class="ac-current">Current: <b id="cur">default</b></div>
      <div class="ac-row">
        <input class="ac-input" id="nameInput" placeholder="New config name" />
        <button class="ac-btn" onclick="saveConfig()">Save</button>
      </div>
      <div class="ac-msg" id="msg"></div>
      <div class="ac-list" id="list"></div>
    </div>
  </div>
  <script>
    async function api(path, opts){ const r=await fetch(path,opts); return r.ok?r.json():null; }
    async function refresh(){
      const d=await api("/api/config/list");
      if(d){ document.getElementById("cur").textContent=d.current||"default";
        const list=document.getElementById("list"); list.innerHTML="";
        (d.configs||[]).forEach(c=>{
          const div=document.createElement("div"); div.className="ac-item"+(c===d.current?" active":"");
          div.innerHTML='<span class="ac-name">'+c+'</span><div class="ac-actions"><button class="ac-btn small" onclick="loadConfig(\''+c+'\')" '+(c===d.current?"disabled":"")+'>Load</button><button class="ac-btn small danger" onclick="delConfig(\''+c+'\')" '+(c==="default"?"disabled":"")+'>Delete</button></div>';
          list.appendChild(div);
        });
      }
    }
    async function saveConfig(){
      const name=document.getElementById("nameInput").value.trim();
      if(!name){document.getElementById("msg").textContent="Enter a name";return;}
      const r=await api("/api/config/save",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name})});
      if(r&&r.ok){document.getElementById("msg").textContent="Saved "+name;document.getElementById("nameInput").value="";refresh();}
      else document.getElementById("msg").textContent=(r&&r.error)||"Save failed";
    }
    async function loadConfig(n){
      const r=await api("/api/config/load",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:n})});
      if(r&&r.ok){document.getElementById("msg").textContent="Loaded "+n;refresh();}
      else document.getElementById("msg").textContent=(r&&r.error)||"Load failed";
    }
    async function delConfig(n){
      if(!confirm("Delete config "+n+"?"))return;
      const r=await api("/api/config/delete",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:n})});
      if(r&&r.ok){document.getElementById("msg").textContent="Deleted "+n;refresh();}
      else document.getElementById("msg").textContent=(r&&r.error)||"Delete failed";
    }
    refresh();
  </script>
</body>
</html>
