<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oxevy Pause Menu</title>
  <link rel="stylesheet" href="style.css" />
  <script src="vendor/react.production.min.js"></script>
  <script src="vendor/react-dom.production.min.js"></script>
  <script src="vendor/babel.min.js"></script>
  <script>
    // Scale handling - same as main menu
    (function () {
      const m = (location.hash.match(/#scale=([\d.]+)/)) || [];
      const base = Math.max(1, parseFloat(m[1]) || 1);
      const root = document.documentElement;
      root.style.setProperty("--s-base", base);

      var DESIGN_W = 48 * 2 + 300;
      var DESIGN_PAD_Y = 24 * 2;
      var designH = 0;

      function measureDesign() {
        var col = document.querySelector(".button-column");
        var center = document.querySelector(".menu-center");
        if (!col || !center) return 0;
        root.style.setProperty("--s", "1");
        designH = center.offsetHeight;
        return designH;
      }

      function applyFit() {
        if (!designH) return;
        var sW = window.innerWidth / DESIGN_W;
        var sH = window.innerHeight / (designH + DESIGN_PAD_Y);
        var s = Math.min(base, sW, sH);
        s = Math.max(1, s);
        root.style.setProperty("--s", s);
      }

      window.__menuFit = function () {
        if (!measureDesign()) { applyFit(); return; }
        applyFit();
      };

      window.addEventListener("resize", function () {
        if (window.__fitPending) return;
        window.__fitPending = true;
        requestAnimationFrame(function () {
          window.__fitPending = false;
          window.__menuFit();
        });
      });

      root.style.setProperty("--s", base);
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
const { useState, useEffect, useRef, useCallback, memo } = React;

// SVG Icons
const Icon = memo(function Icon({ children, className = "menu-icon" }) {
  return (
    <svg aria-hidden="true" className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
      {children}
    </svg>
  );
});

// Static icon definitions - created once
const icons = {
  quit: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>,
  cog: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>,
  // Refresh/relog icon - arrows in a circle
  relog: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M23 4v6h-6"/><path d="M21 10a8.5 8.5 0 0 0-16 3.5L3 14"/><path d="M7 16v6"/><path d="M12 22v-4"/><circle cx="12" cy="12" r="3"/></svg>,
  resume: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><polygon points="5 3 19 12 5 21 5 3"/></svg>,
  multiplayer: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M13 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>,
};

// Static buttons array - created once
const buttons = [
  { id: "resume", label: "Resume Game", icon: icons.resume, action: "resume" },
  { id: "relog", label: "Relog", icon: icons.relog, action: "relog" },
  { id: "multiplayer", label: "Multiplayer", icon: icons.multiplayer, action: "multiplayer" },
  { id: "options", label: "Options...", icon: icons.cog, action: "options" },
  { id: "quit", label: "Quit to Menu", icon: icons.quit, action: "quit", variant: "danger" },
];

// Static footer links - created once
const footerLinks = [
  { label: "Website", url: "https://oxevy.daneq.workers.dev/" },
  { label: "Discord", url: "https://discord.gg/oxevy" },
  { label: "GitHub", url: "https://github.com/oxevy" },
  { label: "Report Bug", url: "https://github.com/oxevy/issues" },
];

// Memoized MenuButton - only re-renders if button or onClick changes
const MenuButton = memo(function MenuButton({ button, onClick }) {
  return (
    <button
      className={`menu-button ${button.variant || ""}`}
      onClick={() => onClick(button.action)}
    >
      <span className="menu-icon">{button.icon}</span>
      <span className="menu-label">{button.label}</span>
    </button>
  );
});

// Memoized FooterLinks - static content, never re-renders
const FooterLinks = memo(function FooterLinks() {
  return (
    <div className="footer-links">
      {footerLinks.map((link, i) => (
        <a key={link.label} href={link.url} target="_blank" rel="noopener noreferrer" className="footer-link">
          {i > 0 && <span className="footer-separator">|</span>}
          {link.label}
        </a>
      ))}
    </div>
  );
});

// Profile Preview Component - displays player's Minecraft skin and info
const ProfilePreview = memo(function ProfilePreview() {
  const [profile, setProfile] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);

  useEffect(() => {
    let cancelled = false;
    let attempts = 0;
    let timer = null;

    const fetchProfile = async () => {
      try {
        const response = await fetch("/api/mainmenu/profile", { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
        const data = await response.json();
        if (cancelled) return;
        setProfile(data);
        setError(null);
        setLoading(false);
      } catch (err) {
        console.error("Profile fetch error:", err);
        if (!cancelled && attempts < 4) {
          attempts += 1;
          timer = setTimeout(fetchProfile, 700);
          return;
        }
        if (!cancelled) {
          setError("Unable to load profile");
          setLoading(false);
        }
      }
    };

    fetchProfile();
    return () => {
      cancelled = true;
      if (timer) clearTimeout(timer);
    };
  }, []);

  if (loading) {
    return (
      <div className="profile-preview loading">
        <div className="profile-head">
          <div className="profile-skeleton"></div>
        </div>
        <div className="profile-info">
          <div className="profile-skeleton profile-skeleton-name"></div>
          <div className="profile-skeleton profile-skeleton-discriminator"></div>
        </div>
      </div>
    );
  }

  if (error) {
    return (
      <div className="profile-preview error">
        <div className="profile-error-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        </div>
        <div className="profile-info">
          <div className="profile-name">Profile unavailable</div>
          <div className="profile-discriminator">{error}</div>
        </div>
      </div>
    );
  }

  if (!profile) {
    return (
      <div className="profile-preview empty">
        <div className="profile-head">
          <div className="profile-skeleton"></div>
        </div>
        <div className="profile-info">
          <div className="profile-skeleton profile-skeleton-name"></div>
        </div>
      </div>
    );
  }

  // Head avatar from mc-heads.net. Prefer the UUID, fall back to the username.
  const skinId = profile.uuid || profile.username || "8667ba71b85a4004af544816a921c14e";
  const skinUrl = `https://mc-heads.net/avatar/${encodeURIComponent(skinId)}/32`;

  return (
    <div className="profile-preview">
      <div className="profile-head">
        <img
          className="profile-skin-img"
          src={skinUrl}
          alt={`${profile.username}'s head`}
          onError={(e) => {
            // Fallback to default Steve head if custom head fails
            e.target.src = "https://mc-heads.net/avatar/8667ba71b85a4004af544816a921c14e/32";
          }}
        />
      </div>
      <div className="profile-info">
        <div className="profile-name">{profile.username}</div>
        {profile.discriminator && (
          <div className="profile-discriminator">#{profile.discriminator}</div>
        )}
      </div>
    </div>
  );
});

// Main App component with memoized callbacks
const App = memo(function App() {
  const navigate = useCallback(async (action) => {
    try {
      await fetch("/api/mainmenu/navigate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action })
      });
    } catch (e) {
      console.error("Navigation failed:", e);
    }
  }, []);

  const handleButtonClick = useCallback((action) => {
    if (action === "quit") {
      window.close();
    } else if (action === "resume") {
      // Resume game - close the pause screen
      window.close();
    } else {
      navigate(action);
    }
  }, [navigate]);

  // Clamp --s so the authored footprint always fits the viewport, and re-fit
  // whenever the window is resized. See the head script for the math.
  useEffect(() => {
    window.__menuFit && window.__menuFit();
  }, []);

  return (
    <div className="menu-root">
      <div className="menu-scrim" />
      <div className="menu-noise" />

      <div className="menu-container">
        <div className="menu-center">
          <div className="menu-left">
            <ProfilePreview />
          </div>
          <div className="button-column">
            {buttons.map((button) => (
              <MenuButton
                key={button.id}
                button={button}
                onClick={handleButtonClick}
              />
            ))}
          </div>
          <FooterLinks />
        </div>
      </div>
    </div>
  );
});

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(App));
  </script>
</body>
</html>
