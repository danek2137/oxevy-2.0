<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cosmetic Preview</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; background: transparent; }
#loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #888; font-family: system-ui; font-size: 14px; }
iframe { width: 100%; height: 100%; border: none; }
</style>
</head>
<body>
<div id="loading">Loading player...</div>
<iframe id="viewer" frameborder="0" title="McView3D"></iframe>
<script>
const params = new URLSearchParams(window.location.search);
const cosmeticId = params.get('cosmetic') || 'angel_wings';
const view = params.get('view') || 'front';
const username = params.get('username') || 'Steve';

// McView3D embed URL with player skin
const url = `https://kurojs.github.io/McView3D/embed.html?skin=${encodeURIComponent(username)}&width=400&height=400`;

// Set view by rotating camera
const viewAngles = {
  front: { yaw: 0, pitch: 0 },
  side: { yaw: 90, pitch: 0 },
  back: { yaw: 180, pitch: 0 }
};

const iframe = document.getElementById('viewer');
iframe.src = url;

iframe.onload = () => {
  document.getElementById('loading').style.display = 'none';
  // Try to set camera view via postMessage if supported
  try {
    iframe.contentWindow.postMessage({
      type: 'setView',
      yaw: viewAngles[view]?.yaw || 0,
      pitch: viewAngles[view]?.pitch || 0
    }, 'https://kurojs.github.io');
  } catch (e) {}
};

// Fallback: if load fails, show error
setTimeout(() => {
  if (document.getElementById('loading').style.display !== 'none') {
    document.getElementById('loading').textContent = 'Could not load viewer';
  }
}, 10000);
</script>
</body>
</html>
