import java.nio.file.Paths
import org.gradle.process.ExecOperations

import javax.inject.Inject

abstract class CompileNativeRpcTask extends DefaultTask {
    @Inject
    abstract ExecOperations getExecOperations()

    @TaskAction
    void compile() {
        def nativeDir = project.file("src/main/native/rpc")
        def nativeOutDir = project.file("build/native")
        def javaHome = System.getenv("JAVA_HOME") ?: project.providers.exec {
            commandLine "bash", "-c", 'dirname $(dirname $(readlink -f $(which java)))'
        }.standardOutput.asText.get().trim()
        nativeOutDir.mkdirs()

        def os = org.gradle.internal.os.OperatingSystem.current()
        def jdkInc = "-I${javaHome}/include"

        if (os.isWindows()) {
            execOperations.exec {
                commandLine "g++", "-shared", "-O2", "-std=c++17",
                        jdkInc,
                        "-I${javaHome}/include/win32",
                        "-I${nativeDir}/win32",
                        "-static-libgcc", "-static-libstdc++", "-Wl,--kill-at",
                        "${nativeDir}/discord_rpc_windows.cpp",
                        "-o", "${nativeOutDir}/oxevy-rpc.dll"
            }
        } else {
            execOperations.exec {
                commandLine "g++", "-shared", "-fPIC", "-O2", "-std=c++17",
                        jdkInc,
                        "-I${javaHome}/include/linux",
                        "${nativeDir}/discord_rpc_linux.cpp",
                        "-o", "${nativeOutDir}/liboxevy-rpc.so"
            }
            // Cross-compile the Windows .dll too when mingw is available.
            def mingw = project.providers.exec {
                commandLine "bash", "-c", "command -v x86_64-w64-mingw32-g++ || true"
            }.standardOutput.asText.get().trim()
            if (mingw) {
                execOperations.exec {
                    commandLine "x86_64-w64-mingw32-g++", "-shared", "-O2", "-std=c++17",
                            jdkInc,
                            "-I${nativeDir}/win32",
                            "-static-libgcc", "-static-libstdc++", "-Wl,--kill-at",
                            "${nativeDir}/discord_rpc_windows.cpp",
                            "-o", "${nativeOutDir}/oxevy-rpc.dll"
                }
            } else {
                logger.lifecycle("mingw not found; skipping Windows oxevy-rpc.dll")
            }
        }
    }
}

plugins {
    id 'fabric-loom' version "$loom_version"
    id 'com.github.gmazzo.buildconfig' version "$buildconfig_version"
    id 'org.jetbrains.kotlin.jvm' version "$kotlin_version"
}

// ===== Multi-version build =====
// Defaults come from gradle.properties (currently 1.21.11). Build another version with:
//   ./gradlew build -PmcVersion=1.21.8
// Per-version overrides live in versions/<mcVersion>/:
//   gradle.properties - minecraft/fabric/loader versions
//   excludes.txt     - shared source/resource files replaced by this version
//   java/ kotlin/    - version-specific replacements for divergent classes
//   resources/       - version-specific resource overrides (e.g. mixins json)
def defaultMcVersion = project.property("minecraft_version").toString()
def mcVersion = project.findProperty("mcVersion")?.toString() ?: defaultMcVersion
def mcProfileDir = file("versions/${mcVersion}")
def mcPropertiesFile = file("${mcProfileDir}/gradle.properties")
def mcFabricVersion = project.property("fabric_version").toString()
def mcLoaderVersion = project.property("loader_version").toString()
if (mcPropertiesFile.exists()) {
    Properties mcProps = new Properties()
    mcPropertiesFile.withInputStream { mcProps.load(it) }
    if (mcProps.getProperty("minecraft_version")) mcVersion = mcProps.getProperty("minecraft_version")
    if (mcProps.getProperty("fabric_version")) mcFabricVersion = mcProps.getProperty("fabric_version")
    if (mcProps.getProperty("loader_version")) mcLoaderVersion = mcProps.getProperty("loader_version")
}
def mcBuildOverride = mcVersion != defaultMcVersion
if (mcBuildOverride) {
    buildDir = file("build/${mcVersion}")
}

def requestedTasks = gradle.startParameter.taskNames
def shouldBumpVersion = false
for (taskName in requestedTasks) {
    String lower = taskName.toLowerCase()
    if (lower.contains('build') || lower.contains('assemble') || lower.contains('jar') ||
            lower.contains('run') || lower.contains('processresources') || lower.contains('generatebuildconfig')) {
        shouldBumpVersion = true
        break
    }
}

def versionPropsFile = file("gradle.properties")
Properties versionProps = new Properties()
versionPropsFile.withInputStream { versionProps.load(it) }

def bumpVersion(String v) {
    List<Integer> parts = v.tokenize('.').collect { Integer.parseInt(it) }
    if (parts.isEmpty()) return "0.0.1"
    int i = parts.size() - 1
    parts.set(i, parts.get(i) + 1)
    while (i > 0 && parts.get(i) >= 10) {
        parts.set(i, 0)
        i--
        parts.set(i, parts.get(i) + 1)
    }
    return parts.join('.')
}

String rawModVersion = versionProps.getProperty('mod_version', '1.0.0')
String oxevyModVersion = rawModVersion
if (shouldBumpVersion) {
    oxevyModVersion = bumpVersion(rawModVersion)
    versionProps.setProperty('mod_version', oxevyModVersion)
    versionProps.store(versionPropsFile.newWriter(), null)
}

var USING_GIT = Paths.get(System.getProperty("user.dir")).resolve(".git").toFile().exists()
var GIT_HASH = execute("git rev-parse --short HEAD")

version = oxevyModVersion
group = project.maven_group

buildConfig {
    buildConfigField(String, "NAME", project.mod_name)
    buildConfigField(String, "GROUP", project.group)
    buildConfigField(String, "VERSION", oxevyModVersion)
    buildConfigField(String, "BUILD_TIME", "${new Date(System.currentTimeMillis()).format("MM/dd/yyyy HH:mm")}")
    buildConfigField(Boolean, "USING_GIT", USING_GIT)
    buildConfigField(String, "HASH", GIT_HASH)
    buildConfigField(String, "BRANCH", "${execute("git branch --show-current")}")

    packageName "${project.group}.util"
    useJavaOutput()
    generateAtSync = true
}

sourceSets.main.java.srcDirs += file("${buildDir}/gen/buildconfig/src/main")
sourceSets.main.kotlin.srcDirs += "src/main/kotlin"

if (mcBuildOverride) {
    def mergedJava = file("${buildDir}/generated/version-src/java")
    def mergedKotlin = file("${buildDir}/generated/version-src/kotlin")
    def mergedResources = file("${buildDir}/generated/version-src/resources")

    def excludes = []
    def excludesFile = file("${mcProfileDir}/excludes.txt")
    if (excludesFile.exists()) {
        excludesFile.eachLine { line ->
            def l = line.trim()
            if (l && !l.startsWith("#")) excludes.add(l)
        }
    }

    tasks.register("syncVersionSources") {
        outputs.upToDateWhen { false }
        doFirst {
            delete mergedJava, mergedKotlin, mergedResources
            copy {
                from("src/main/java")
                into mergedJava
            }
            copy {
                from("src/main/kotlin")
                into mergedKotlin
            }
            copy {
                from("src/main/resources")
                into mergedResources
            }
            excludes.each { rel ->
                delete file("${mergedJava}/${rel}")
                delete file("${mergedKotlin}/${rel}")
                delete file("${mergedResources}/${rel}")
            }
            if (file("${mcProfileDir}/java").exists()) {
                copy {
                    from "${mcProfileDir}/java"
                    into mergedJava
                }
            }
            if (file("${mcProfileDir}/kotlin").exists()) {
                copy {
                    from "${mcProfileDir}/kotlin"
                    into mergedKotlin
                }
            }
            if (file("${mcProfileDir}/resources").exists()) {
                copy {
                    from "${mcProfileDir}/resources"
                    into mergedResources
                }
            }
        }
    }

    sourceSets.main.java.srcDirs = [mergedJava, file("${buildDir}/gen/buildconfig/src/main"), file("${buildDir}/generated/sources/buildConfig/main")]
    sourceSets.main.kotlin.srcDirs = [mergedKotlin, mergedJava, file("${buildDir}/generated/sources/buildConfig/main")]
    sourceSets.main.resources.srcDirs = [mergedResources]

    tasks.withType(JavaCompile).configureEach { dependsOn("syncVersionSources") }
    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach { dependsOn("syncVersionSources") }
    tasks.named("processResources") { dependsOn("syncVersionSources") }
}

base {
    archivesName = "${project.archives_base_name}"
}

repositories {
    mavenCentral()
    maven { url = uri("https://maven.wispforest.io/releases/") }
    maven { url = uri("https://jitpack.io") }
}

loom {
    accessWidenerPath = file("src/main/resources/oxevy.accesswidener")
}

dependencies {
    minecraft "com.mojang:minecraft:${mcVersion}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${mcLoaderVersion}"
    // Fabric API
    modImplementation "net.fabricmc.fabric-api:fabric-api:${mcFabricVersion}"

    include implementation("com.github.cattyngmd.catformat:catformat-core:${project.catformat_version}")
    include modImplementation("com.github.cattyngmd.catformat:catformat-fabric:${project.catformat_version}")

    // Fabric Language Kotlin - include runtime
    modImplementation "net.fabricmc:fabric-language-kotlin:${project.fabric_kotlin_version}"
    include("net.fabricmc:fabric-language-kotlin:${project.fabric_kotlin_version}")
    
    // Explicitly include kotlin runtime
    implementation("org.jetbrains.kotlin:kotlin-stdlib:2.0.21")
    
}

processResources {
    def modVersion = project.version
    def minecraftVersion = mcVersion
    def loaderVersion = mcLoaderVersion

    inputs.property "version", modVersion
    inputs.property "minecraft_version", minecraftVersion
    inputs.property "loader_version", loaderVersion
    filteringCharset = "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": modVersion,
                "minecraft_version": minecraftVersion,
                "loader_version": loaderVersion
    }
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release = targetJavaVersion
    }
}

kotlin {
    jvmToolchain(targetJavaVersion)
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions {
        jvmTarget = "${targetJavaVersion}"
        freeCompilerArgs += ["-Xjvm-default=all"]
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

sourcesJar {
    dependsOn(generateBuildConfig)
}

jar {
    from("LICENSE") {
        rename { "${it}_${archives_base_name}" }
    }
}

def nativeOutDir = file("build/native")
def nativeResourceDir = file("build/native-resources/oxevy/native")

tasks.register("compileNativeRpc", CompileNativeRpcTask)

tasks.register("stageNativeRpc", Sync) {
    dependsOn("compileNativeRpc")
    def os = org.gradle.internal.os.OperatingSystem.current()
    def hostPlatform = os.isWindows() ? "windows" : (os.isMacOsX() ? "macos" : "linux")
    def arch = System.getProperty("os.arch")
    def hostArchDir = arch == "aarch64" || arch == "arm64" ? "aarch64" :
            (arch == "x86_64" || arch == "amd64" ? "x86_64" : arch)
    // Host platform binary.
    def hostLib = hostPlatform == "windows" ? "oxevy-rpc.dll" : "liboxevy-rpc.so"
    from(file("${nativeOutDir}/${hostLib}")) {
        into("${hostPlatform}-${hostArchDir}")
    }
    // Windows .dll cross-compiled from Linux hosts.
    if (hostPlatform == "linux") {
        from(file("${nativeOutDir}/oxevy-rpc.dll")) {
            into("windows-x86_64")
        }
    }
    into(nativeResourceDir)
}

tasks.named("processResources") {
    dependsOn("stageNativeRpc")
}

jar {
    from(nativeResourceDir) {
        into("oxevy/native")
    }
}

tasks.withType(JavaCompile).configureEach {
    dependsOn(generateBuildConfig)
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    dependsOn(generateBuildConfig)
}

def execute(String cmd) {
    var output = providers.exec {
        commandLine cmd.split(" ")
        ignoreExitValue = true
    }
    return output.standardOutput.getAsText().getOrElse("nogit")
            .replaceAll("\n", "");
}
